<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iterator · Frontend Lab</title>
    <link rel="icon" href="/assets/lab.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/pages.css" />
    <style>
      .iter-actions { display: flex; gap: 8px; margin-top: 18px; }
      .iter-actions a {
        display: inline-flex; align-items: center; gap: 8px;
        min-height: 38px; padding: 0 15px;
        border: 1px solid var(--border); border-radius: 8px;
        background: var(--surface); color: var(--muted);
        text-decoration: none; font-size: 14px;
      }
      .iter-actions a:hover { color: var(--ink); }
      .iter-actions a.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="gallery">
        <nav class="gallery-nav" aria-label="Workspace">
          <a class="nav-home" href="/" aria-label="Frontend Lab home">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z" /><path d="M9 21v-7h6v7" /></svg>
          </a>
          <a href="/">Generator</a>
          <a href="/previews">Previews</a>
        </nav>
        <header class="intro">
          <h1>Iterator</h1>
          <p>Pick the designs worth keeping, then edit or merge them into one. Sources are copied, so iterating never touches the generator output.</p>
          <div class="iter-actions">
            <a class="primary" href="/iterators/new">New iterator</a>
            <a href="/previews">Previews</a>
          </div>
        </header>
        <section class="project-section" aria-labelledby="iterators-title">
          <h2 id="iterators-title" tabindex="-1">Workspaces</h2>
          <div class="project-grid" id="grid"></div>
        </section>
      </main>
    </div>

    <script>
      const grid = document.getElementById("grid");

      function card(project) {
        const article = document.createElement("article");
        article.className = "project-card";
        const link = document.createElement("a");
        link.href = `/iterator/${encodeURIComponent(project.id)}`;
        link.setAttribute("aria-label", `Open ${project.name}`);

        const cover = document.createElement("div");
        cover.className = "project-cover";
        if (project.cover) {
          const img = document.createElement("img");
          img.src = project.cover;
          img.alt = "";
          cover.append(img);
        }
        const badge = document.createElement("span");
        badge.className = "sample";
        badge.innerHTML = "<span></span> Iterator";
        cover.append(badge);

        const body = document.createElement("div");
        body.className = "card-body";
        const title = document.createElement("h3");
        title.textContent = project.name;
        const meta = document.createElement("p");
        meta.textContent = `${project.sources.length} sources · ${project.builds.length} builds`;
        body.append(title, meta);
        link.append(cover, body);
        article.append(link);
        return article;
      }

      fetch("/api/iterators", { cache: "no-store" })
        .then((response) => response.json())
        .then((state) => {
          const list = state.iterators || [];
          if (!list.length) {
            grid.innerHTML =
              '<div class="empty-gallery"><h3>No iterators yet</h3><p>Pick designs from a generator project to start one.</p><a href="/iterators/new" style="color:var(--ink)">New iterator</a></div>';
            return;
          }
          list.forEach((project) => grid.append(card(project)));
        });
    </script>
  </body>
</html>
