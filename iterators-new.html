<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New iterator · Frontend Lab</title>
    <link rel="icon" href="/assets/lab.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/pages.css" />
    <style>
      .wrap { max-width: 900px; }
      .field { display: flex; flex-direction: column; gap: 8px; margin: 22px 0; }
      .field input[type="text"] {
        min-height: 40px; padding: 0 12px;
        border: 1px solid var(--border); border-radius: 8px;
        background: var(--surface); color: var(--ink); font-size: 15px;
      }
      .group { margin: 26px 0 10px; color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
      .row {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 12px; margin-bottom: 4px;
        border: 1px solid var(--border); border-radius: 8px;
        background: var(--surface); cursor: pointer;
      }
      .row:hover { border-color: #4a443f; }
      .row input { accent-color: var(--pink); width: 16px; height: 16px; }
      .row .meta { color: var(--muted); font-size: 13px; }
      .row strong { font-weight: 550; }
      .footer { display: flex; align-items: center; gap: 14px; margin: 26px 0 60px; }
      .footer button {
        min-height: 40px; padding: 0 18px; border: 0; border-radius: 8px;
        background: var(--ink); color: var(--paper); font: inherit; font-size: 15px; cursor: pointer;
      }
      .footer button:disabled { opacity: .5; cursor: default; }
      .note { color: var(--muted); font-size: 13px; }
      .error { color: #ff7a5c; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="gallery wrap">
        <nav class="gallery-nav" aria-label="Workspace">
          <a class="nav-home" href="/" aria-label="Frontend Lab home">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z" /><path d="M9 21v-7h6v7" /></svg>
          </a>
          <a href="/">Generator</a>
          <a href="/iterators">Iterator</a>
        </nav>
        <header class="intro">
          <h1>New iterator</h1>
          <p>Choose the designs to keep. Each one is copied into the workspace, so editing and merging never changes the original build.</p>
        </header>
        <label class="field">
          <span class="note">Workspace name</span>
          <input id="name" type="text" placeholder="Trio merge" autocomplete="off" />
        </label>
        <div id="list" class="note">Loading builds…</div>
        <div class="footer">
          <button id="create" type="button" disabled>Create iterator</button>
          <span id="count" class="note">0 selected</span>
          <span id="error" class="error"></span>
        </div>
      </main>
    </div>

    <script>
      const list = document.getElementById("list");
      const nameInput = document.getElementById("name");
      const createButton = document.getElementById("create");
      const count = document.getElementById("count");
      const errorNode = document.getElementById("error");
      const chosen = new Set();

      function update() {
        count.textContent = `${chosen.size} selected`;
        createButton.disabled = chosen.size === 0 || !nameInput.value.trim();
      }

      function group(title) {
        const node = document.createElement("div");
        node.className = "group";
        node.textContent = title;
        list.append(node);
      }

      function row(build, project) {
        const label = document.createElement("label");
        label.className = "row";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.addEventListener("change", () => {
          if (input.checked) chosen.add(build.entry);
          else chosen.delete(build.entry);
          update();
        });
        const text = document.createElement("span");
        text.innerHTML = `<strong>${project.name}</strong> <span class="meta">· ${build.model} · ${build.skill} · variant ${build.variant}</span>`;
        label.append(input, text);
        return label;
      }

      fetch("/api/state", { cache: "no-store" })
        .then((response) => response.json())
        .then((state) => {
          list.textContent = "";
          const projects = (state.projects || []).filter((project) => project.kind !== "iterator");
          if (!projects.length) {
            list.textContent = "No generator builds yet.";
            return;
          }
          for (const project of projects) {
            if (!project.builds.length) continue;
            group(project.name);
            for (const build of project.builds) list.append(row(build, project));
          }
        })
        .catch(() => {
          list.textContent = "Could not load builds.";
        });

      nameInput.addEventListener("input", update);

      createButton.addEventListener("click", async () => {
        errorNode.textContent = "";
        createButton.disabled = true;
        const sources = [...chosen].map((entry) => ({ entry, label: entry, project: entry.split("/")[1] || "", }));
        try {
          const response = await fetch("/api/iterators", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: nameInput.value.trim(), sources }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Could not create the iterator");
          location.href = `/?project=${encodeURIComponent(data.id)}`;
        } catch (error) {
          errorNode.textContent = String(error.message || error);
          update();
        }
      });
    </script>
  </body>
</html>
