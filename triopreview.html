<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CA Trio, selected designs</title>
    <style>
      :root {
        color-scheme: dark;
        --rail-width: 46px;
        --rail-top: 18px;
        --rail-edge: 18px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #141312;
        color: #bcb7b1;
        font: 14px/1.4 Geist, ui-sans-serif, system-ui, sans-serif;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      .preview-tools {
        position: fixed;
        z-index: 5;
        top: var(--rail-top);
        right: var(--rail-edge);
      }
      .rail {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2.5px;
        width: var(--rail-width);
        max-height: calc(100dvh - var(--rail-top) - 12px);
        padding: 4px;
        overflow-y: auto;
        scrollbar-width: none;
        border: 1px solid #403c38;
        border-radius: 9px;
        background: #292622;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .rail button,
      .rail a {
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 34px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #bcb7b1;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        text-decoration: none;
      }
      .rail button:hover,
      .rail a:hover { color: #f0ece6; background: #34302c; }
      .rail button[aria-current="true"] {
        color: #f0ece6;
        background: #3d3833;
      }
      .rail-rule { height: 1px; margin: 2px 4px; background: #403c38; }
      @media (max-width: 640px) {
        :root { --rail-edge: 8px; --rail-top: 8px; --rail-width: 40px; }
      }
    </style>
  </head>
  <body>
    <iframe id="frame" title="Selected design" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    <div class="preview-tools">
      <aside class="rail" id="rail" aria-label="Selected designs and tools"></aside>
    </div>

    <script>
      const frame = document.getElementById("frame");

      function lockInside(frame) {
        frame.addEventListener("load", () => {
          let doc;
          try { doc = frame.contentDocument; } catch { return; }
          const root = doc.documentElement;
          if (!root || root.dataset.locked) return;
          root.dataset.locked = "1";
          doc.addEventListener("click", (event) => {
            const target = event.target instanceof Element ? event.target : null;
            const link = target ? target.closest("a[href]") : null;
            if (!link) return;
            let url;
            try { url = new URL(link.getAttribute("href"), frame.contentWindow.location.href); } catch { return; }
            const external = /^(https?|mailto|tel|ftp):$/i.test(url.protocol) && url.origin !== location.origin;
            if (external || /^(mailto|tel):/i.test(link.getAttribute("href") || "")) event.preventDefault();
          }, true);
        });
      }
      lockInside(frame);
      const rail = document.getElementById("rail");
      let variants = [];
      let current = 0;
      let admin = false;

      const home = document.createElement("a");
      home.href = "/previews";
      home.title = "All previews";
      home.setAttribute("aria-label", "All previews");
      home.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>';
      rail.append(home);

      const ruleTop = document.createElement("div");
      ruleTop.className = "rail-rule";
      rail.append(ruleTop);

      const adminButton = document.createElement("button");
      adminButton.type = "button";
      adminButton.title = "Admin panel for this direction";
      adminButton.setAttribute("aria-label", "Admin panel");
      adminButton.setAttribute("aria-pressed", "false");
      adminButton.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';

      function paint(currentOnly) {
        frame.src = admin ? `${variants[current].url}#/admin` : variants[current].url;
        if (!currentOnly) return;
        rail.querySelectorAll("button[data-index]").forEach((button) => {
          if (Number(button.dataset.index) === current) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        });
        adminButton.setAttribute("aria-current", String(admin));
        adminButton.setAttribute("aria-pressed", String(admin));
        document.title = `${variants[current].label || "Design"} · CA Trio`;
      }

      function show(index, push) {
        if (!variants[index]) return;
        current = index;
        paint(true);
        if (push) history.replaceState(null, "", `/triopreview?v=${index + 1}${admin ? "&admin=1" : ""}`);
      }

      adminButton.addEventListener("click", () => {
        admin = !admin;
        paint(true);
        history.replaceState(null, "", `/triopreview?v=${current + 1}${admin ? "&admin=1" : ""}`);
      });

      fetch("/projects/trio/client.json", { cache: "no-store" })
        .then((response) => response.json())
        .then((data) => {
          variants = Array.isArray(data.variants) ? data.variants : [];
          if (!variants.length) return;
          document.title = `${data.title || "Preview"} · design proposals`;
          variants.forEach((item, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.dataset.index = String(index);
            button.textContent = String(index + 1);
            button.title = `${item.label || `Design ${index + 1}`}${item.note ? ` · ${item.note}` : ""}`;
            button.setAttribute("aria-label", item.label || `Design ${index + 1}`);
            button.addEventListener("click", () => show(index, true));
            rail.append(button);
          });
          const ruleBottom = document.createElement("div");
          ruleBottom.className = "rail-rule";
          rail.append(ruleBottom, adminButton);
          const params = new URLSearchParams(location.search);
          admin = params.get("admin") === "1";
          const requested = Number(params.get("v") || "1");
          show(Math.min(Math.max(requested, 1), variants.length) - 1, false);
        })
        .catch(() => {
          document.title = "CA Trio · could not load";
        });
    </script>
  </body>
</html>
