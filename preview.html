<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CA Trio, selected designs</title>
    <style>
      :root {
        color-scheme: dark;
        --rail-width: 46px;
        --rail-top: 18px;
        --rail-edge: 18px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #141312;
        color: #bcb7b1;
        font: 14px/1.4 Geist, ui-sans-serif, system-ui, sans-serif;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      .preview-tools {
        position: fixed;
        z-index: 5;
        top: var(--rail-top);
        right: var(--rail-edge);
      }
      .rail {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2.5px;
        width: var(--rail-width);
        max-height: calc(100dvh - var(--rail-top) - 12px);
        padding: 4px;
        overflow-y: auto;
        scrollbar-width: none;
        border: 1px solid #403c38;
        border-radius: 9px;
        background: #292622;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .rail button {
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 34px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #bcb7b1;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .rail button:hover { color: #f0ece6; background: #34302c; }
      .rail button[aria-current="true"] {
        color: #f0ece6;
        background: #3d3833;
      }
      .rail-rule { height: 1px; margin: 2px 4px; background: #403c38; }
      @media (max-width: 640px) {
        :root { --rail-edge: 8px; --rail-top: 8px; --rail-width: 40px; }
      }
    </style>
  </head>
  <body>
    <iframe id="frame" title="Selected design" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    <div class="preview-tools">
      <aside class="rail" id="rail" aria-label="Selected designs"></aside>
    </div>

    <script>
      const frame = document.getElementById("frame");

      function lockInside(frame) {
        frame.addEventListener("load", () => {
          let doc;
          try { doc = frame.contentDocument; } catch { return; }
          const root = doc.documentElement;
          if (!root || root.dataset.locked) return;
          root.dataset.locked = "1";
          doc.addEventListener("click", (event) => {
            const target = event.target instanceof Element ? event.target : null;
            const link = target ? target.closest("a[href]") : null;
            if (!link) return;
            let url;
            try { url = new URL(link.getAttribute("href"), frame.contentWindow.location.href); } catch { return; }
            const external = /^(https?|mailto|tel|ftp):$/i.test(url.protocol) && url.origin !== location.origin;
            if (external || /^(mailto|tel):/i.test(link.getAttribute("href") || "")) event.preventDefault();
          }, true);
        });
      }
      lockInside(frame);
      const rail = document.getElementById("rail");
      let variants = [];

      function show(index, push) {
        const item = variants[index];
        if (!item) return;
        frame.src = item.url;
        rail.querySelectorAll("button").forEach((button) => {
          if (Number(button.dataset.index) === index) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        });
        document.title = `${item.label || "Design"} · CA Trio`;
        if (push) history.replaceState(null, "", `/preview/${id}/?v=${index + 1}`);
      }

      const parts = location.pathname.split("/").filter(Boolean);
      const id = parts[1] || "trio";

      fetch(`/projects/${id}/client.json`, { cache: "no-store" })
        .then((response) => response.json())
        .then((data) => {
          variants = Array.isArray(data.variants) ? data.variants : [];
          variants.forEach((item, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.dataset.index = String(index);
            button.textContent = String(index + 1);
            button.title = item.label || `Design ${index + 1}`;
            button.setAttribute("aria-label", `Design ${index + 1}`);
            button.addEventListener("click", () => show(index, true));
            rail.append(button);
          });
          const requested = Number(new URLSearchParams(location.search).get("v") || "1");
          show(Math.min(Math.max(requested, 1), variants.length) - 1, false);
        })
        .catch(() => {
          document.title = "CA Trio · could not load";
        });
    </script>
  </body>
</html>
