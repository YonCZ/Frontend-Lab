<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontend Lab</title>
  <meta name="description" content="A local workbench for comparing frontend builds made from one brief.">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0c0e'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23ff6a35' stroke-width='1'/%3E%3Cpath d='M11 21V11h7v2h-5v2.5h4v2h-4V21z' fill='%23e8eaed'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="menu.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="menubar">
    <a class="brand" href="./" data-nav="library" aria-label="Frontend Lab, library">
      <span class="brand-mark" aria-hidden="true">FL</span>
      <span class="brand-name">Frontend Lab</span>
    </a>
    <nav class="menu-nav" aria-label="Screens">
      <a href="./" data-nav="library">Library</a>
      <a href="?project=trio" data-nav="project">Project</a>
      <button type="button" data-nav="preview" id="menu-preview" title="Open the selected build in a preview">Preview</button>
    </nav>
    <div class="menu-side">
      <span class="menu-count mono">03 projects / 56 builds</span>
      <nav class="variant-nav" aria-label="Design variant">
        <a href="../1/" data-variant="1" title="Design variant 1">1</a>
        <a href="../2/" data-variant="2" title="Design variant 2">2</a>
        <a href="../3/" data-variant="3" title="Design variant 3">3</a>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <dialog id="overlay" class="overlay" aria-labelledby="overlay-title">
    <div class="overlay-shell">
      <div class="overlay-bar">
        <p class="overlay-title mono" id="overlay-title">Preview</p>
        <div class="overlay-actions">
          <button type="button" class="overlay-button" id="full-toggle" aria-pressed="false">Full window</button>
          <button type="button" class="overlay-button" id="close-overlay">Close <span class="mono">Esc</span></button>
        </div>
      </div>
      <div class="overlay-stage" id="overlay-stage"></div>
    </div>
  </dialog>

  <div class="sr-only" id="live" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
