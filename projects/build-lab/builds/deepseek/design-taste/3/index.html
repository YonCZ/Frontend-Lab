<!doctype html>
<html lang="en" data-variant="3">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frontend Lab — Library</title>
  <meta name="description" content="A local workbench for comparing frontend builds made by different models and skills from one brief." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0d0e10" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0e10'/%3E%3Crect x='8.5' y='8.5' width='13' height='13' fill='none' stroke='%23e9e7e1'/%3E%3Crect x='17' y='17' width='6.5' height='6.5' fill='%23e0b355'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="./" aria-label="Frontend Lab, library">
        <span class="mark" aria-hidden="true"><span></span></span>
        <span class="brand-name">Frontend Lab</span>
      </a>
      <nav class="bar-nav" aria-label="Screens">
        <a href="./" data-screen="library">Library</a>
        <a href="./?project=trio" data-screen="project">Project</a>
      </nav>
      <div class="design" role="group" aria-label="Design variant">
        <span class="design-label" aria-hidden="true">Design</span>
        <a href="../1/" data-design="1">01</a>
        <a href="../2/" data-design="2">02</a>
        <a href="../3/" data-design="3">03</a>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ov-build" hidden>
    <div class="ov-bar">
      <span class="ov-project" id="ov-project">Frontend Lab</span>
      <span class="ov-sep" aria-hidden="true">/</span>
      <span class="ov-build" id="ov-build"></span>
      <div class="ov-actions">
        <button type="button" class="tbtn" id="ov-full" aria-pressed="false">Full window</button>
        <button type="button" class="tbtn" id="ov-close">Close <kbd>Esc</kbd></button>
      </div>
    </div>
    <div class="ov-frame">
      <iframe id="ov-frame" title="Build preview"></iframe>
    </div>
    <button type="button" class="tbtn ov-return" id="ov-return" hidden>Exit full window</button>
  </div>

  <dialog class="cmp" id="cmp" aria-labelledby="cmp-title">
    <div class="cmp-head">
      <h2 id="cmp-title">Compare with</h2>
      <button type="button" class="tbtn" id="cmp-close">Close</button>
    </div>
    <p class="cmp-note">The selected build stays. Pick a second build to pin beside it.</p>
    <label class="search cmp-search">
      <span class="sr-only">Search builds by model or skill</span>
      <input id="cmp-q" type="search" placeholder="Search model or skill" autocomplete="off" spellcheck="false" />
    </label>
    <div class="cmp-list" id="cmp-list"></div>
  </dialog>

  <p class="sr-only" id="live" role="status" aria-live="polite"></p>

  <script src="app.js"></script>
</body>
</html>
