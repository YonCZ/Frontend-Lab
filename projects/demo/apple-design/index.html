<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noema: three landing page directions</title>
<meta name="theme-color" content="#fbfbfd">
<link rel="icon" href="shared/favicon.svg" type="image/svg+xml">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;display:grid;place-items:center;
    background:#fbfbfd;color:#1d1d1f;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main{width:min(100% - 40px,560px)}
  .mark{width:34px;height:34px;margin-bottom:26px}
  h1{font-size:clamp(34px,6vw,48px);line-height:1.04;letter-spacing:-.04em;font-weight:600;margin:0 0 14px}
  p{font-size:15px;line-height:1.55;color:#6e6e73;margin:0 0 28px;max-width:44ch}
  nav{display:flex;flex-wrap:wrap;gap:10px}
  a{
    display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 18px;
    border:1px solid #d2d2d7;border-radius:999px;background:#fff;
    color:#1d1d1f;font-size:14px;text-decoration:none;
    transition:transform .16s cubic-bezier(.22,1,.36,1),border-color .16s ease,box-shadow .16s ease;
  }
  a:hover{border-color:#1d1d1f;box-shadow:0 8px 20px -14px rgba(0,0,0,.4)}
  a:active{transform:scale(.97)}
  a span{font-size:10px;letter-spacing:.08em;color:#86868b;font-variant-numeric:tabular-nums}
  a:focus-visible{outline:2px solid #2f4fe0;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="1" y="1" width="22" height="22" rx="7" fill="#1d1d1f"/>
    <path d="M7.8 16.4V7.6l8.4 8.8V7.6" fill="none" stroke="#fbfbfd" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Noema, three directions.</h1>
  <p>One second brain, designed three ways with Apple's principles for interface, material and motion. The switcher at the bottom of each page moves between them.</p>
  <nav aria-label="Design directions">
    <a href="1/"><span>01</span>Daylight</a>
    <a href="2/"><span>02</span>Nightfall</a>
    <a href="3/"><span>03</span>Fieldwork</a>
  </nav>
</main>
</body>
</html>
