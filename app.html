<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1440, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lab Desktop" />
    <meta name="theme-color" content="#141312" />
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/app-180.png" />
    <title>Lab Desktop</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141312;
        color: #f0ece6;
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      /* Stage respects the notch / home indicator via safe-area insets. */
      #stage {
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #frame {
        display: block;
        width: 1440px; /* fixed desktop layout width; scaled to fit below */
        height: 100%;
        border: 0;
        background: #fff;
        transform-origin: 0 0;
      }
      /* Build picker (only when ?src= is absent) */
      #pick {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        background: #141312;
      }
      #pick header {
        padding: 48px 96px 32px;
      }
      #pick h1 {
        margin: 0 0 8px;
        font-size: 84px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #pick p {
        margin: 0;
        font-size: 52px;
        color: #bcb7b1;
      }
      #list {
        flex: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 40px;
        align-content: start;
        padding: 0 96px calc(env(safe-area-inset-bottom, 0px) + 96px);
        scrollbar-width: none;
      }
      #list::-webkit-scrollbar { display: none; }
      #list a {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 240px; /* large tap target once the phone scales 1440px down */
        padding: 40px 56px;
        border: 2px solid #2c2a27;
        border-radius: 32px;
        background: #201f1c;
        color: #f0ece6;
        text-decoration: none;
      }
      #list a:active { background: #2c2a27; }
      #list .skill {
        font-size: 72px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      #list .variant {
        font-size: 48px;
        color: #bcb7b1;
        margin-top: 16px;
      }
      #list .err {
        grid-column: 1 / -1;
        font-size: 52px;
        color: #e58c6d;
      }
    </style>
  </head>
  <body>
    <div id="stage"><iframe id="frame" title="Build"></iframe></div>
    <div id="pick" hidden>
      <header>
        <h1>Demo builds</h1>
        <p>Pick a build to open it at desktop width.</p>
      </header>
      <nav id="list" aria-label="Demo builds"></nav>
    </div>
    <script>
      var WIDTH = 1440;
      var params = new URLSearchParams(location.search);
      var src = params.get("src") || "";
      var frame = document.getElementById("frame");
      var stage = document.getElementById("stage");

      // Keep the iframe's internal desktop viewport at 1440px while fitting
      // it into the safe-area-adjusted stage. CSS transforms do not change the
      // iframe's internal layout viewport, so the build always sees 1440.
      function fit() {
        var w = stage.clientWidth;
        var h = stage.clientHeight;
        if (!w || !h) return;
        var s = w / WIDTH;
        frame.style.transform = "scale(" + s + ")";
        frame.style.height = h / s + "px";
      }
      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", fit);

      if (src) {
        if (src.charAt(0) !== "/") src = "/" + src;
        frame.src = src;
        fit();
      } else {
        frame.remove();
        document.getElementById("pick").hidden = false;
        fetch("/api/state")
          .then(function (r) { return r.json(); })
          .then(function (state) {
            var list = document.getElementById("list");
            var demo = (state.projects || []).filter(function (p) {
              return p.id === "demo";
            })[0];
            (demo && demo.builds ? demo.builds : []).forEach(function (b) {
              var a = document.createElement("a");
              a.href = "?src=" + encodeURIComponent("/" + b.entry.replace(/^\/+/, ""));
              var skill = document.createElement("span");
              skill.className = "skill";
              skill.textContent = b.skill;
              var variant = document.createElement("span");
              variant.className = "variant";
              variant.textContent = "Variant " + b.variant;
              a.appendChild(skill);
              a.appendChild(variant);
              list.appendChild(a);
            });
            if (!list.children.length) {
              list.textContent = "No demo builds found.";
            }
          })
          .catch(function () {
            document.getElementById("list").textContent =
              "Could not load builds. Check the connection and reopen the app.";
          });
      }
    </script>
  </body>
</html>
